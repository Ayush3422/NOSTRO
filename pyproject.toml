[project]
name = "nostro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "polars>=1.0",
    "duckdb>=1.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "anthropic>=0.116",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
nostro = "nostro.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
